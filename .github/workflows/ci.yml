name: CI

on: [push]

jobs:

  build:
    name: ${{ matrix.platform.name }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      
      matrix:
        platform:
        #- { name: Windows VS2019, os: windows-2019  }
        - { name: win64, os: windows-latest  }
        - { name: linux-x64,      os: ubuntu-latest }
        #- { name: Linux Clang,    os: ubuntu-latest, flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ }
        - { name: macos,          os: macos-latest  }
        config:
        # - { name: Shared, flags: -DBUILD_SHARED_LIBS=TRUE }
        - { name: Static, flags: -DBUILD_SHARED_LIBS=FALSE }

    steps:
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install libxrandr-dev libxcursor-dev libudev-dev libopenal-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype-dev

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure
      shell: bash
      run: cmake -S . -B build -DCMAKE_INSTALL_PREFIX=install ${{matrix.platform.flags}} ${{matrix.config.flags}}

    - name: Build
      shell: bash
      run: cmake --build build --config Release

    - name: Install
      shell: bash
      run: cmake --install build --config Release

    - name: Package executable 
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then 
          cp  install/bin/*.exe ../banana-split-${{ runner.os }}.exe 
        else 
          cp  install/bin/BananaSplit ../banana-split-${{ runner.os }} 
        fi
        
    - name: Zip executable (Linux/macOS) 
      if: runner.os != 'Windows' 
      run: |
        zip banana-split-${{ runner.os }}.zip banana-split-${{ runner.os }} 
    
    - name: Zip executable (Windows) 
      if: runner.os == 'Windows' 
      run: |
        powershell Compress-Archive -Path banana-split-${{ runner.os }}.exe -DestinationPath banana-split-${{ runner.os }}.zip     
    
    - name: Upload artifact 
      uses: actions/upload-artifact@v4 
      with: 
        name: banana-split-${{ matrix.os }} 
        path: banana-split-${{ matrix.os }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./dist/**/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 