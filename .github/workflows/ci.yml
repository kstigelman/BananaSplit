name: CI


on: [push]

jobs:
  build:
    name: ${{ matrix.platform.name }} ${{ matrix.config.name }}
    runs-on: ${{ matrix.platform.os }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        #- { name: Windows VS2019, os: windows-2019  }
        - { name: win64, os: windows-latest  }
        - { name: linux-x64,      os: ubuntu-latest }
        #- { name: Linux Clang,    os: ubuntu-latest, flags: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ }
        - { name: macos,          os: macos-latest  }
        config:
        - { name: Shared, flags: -DBUILD_SHARED_LIBS=TRUE }
        - { name: Static, flags: -DBUILD_SHARED_LIBS=FALSE }

    steps:
    - name: Install Linux Dependencies
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install libxrandr-dev libxcursor-dev libudev-dev libopenal-dev libflac-dev libvorbis-dev libgl1-mesa-dev libegl1-mesa-dev libfreetype-dev

    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure
      shell: bash
      run: cmake -S . -B build -DCMAKE_INSTALL_PREFIX=install ${{matrix.platform.flags}} ${{matrix.config.flags}}

    - name: Build
      shell: bash
      run: cmake --build build --config Release

    - name: Install
      shell: bash
      run: cmake --install build --config Release

    - name: Rename binary (WINDOWS)
      if: runner.os == 'Windows'
      run: mv install/bin/BananaSplit.exe install/bin/BananaSplit-${{ matrix.name }}.exe

    - name: Rename binary (UNIX)
      if: runner.os == 'Linux' || runner.os == 'MacOS'
      run: mv install/bin/BananaSplit install/bin/BananaSplit-${{ matrix.name }}

    - name: Upload binaries to Release (UNIX)
      if: runner.os == 'Linux' || runner.os == 'MacOS'
      uses: svenstaro/upload-release-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: install/bin/BananaSplit-${{ matrix.name }}
        asset_name: BananaSplit-${{ matrix.name }}
        tag: ${{ github.ref }}
        overwrite: true
        body: ""

    - name: Upload binaries to Release (WINDOWS)
      if: runner.os == 'Windows'
      uses: svenstaro/upload-release-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: install/bin/BananaSplit-${{ matrix.name }}.exe
        asset_name: BananaSplit-${{ matrix.name }}.exe
        tag: ${{ github.ref }}
        overwrite: true
        body: ""
